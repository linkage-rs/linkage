[package]
name = "linkage"
version = "0.3.1"
authors = ["Clark Moody <clark@clarkmoody.com>"]
edition = "2024"

[dependencies]
dirs-next = "2.0"
itertools = "0.14"

rand = "0.10"
serde_json = "1.0"
statrs = "0.18"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.tokio]
version = "1.0"
features = ["fs"]

[dependencies.iced]
features = ["tokio", "wgpu", "tiny-skia", "advanced"]
version = "0.14"
